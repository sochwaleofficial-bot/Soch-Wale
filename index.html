    <script>
      /* Compatibility shim: make window.fetch assignable for testing extensions and runners */
      (function () {
        try {
          var _currFetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function () {
              return _currFetch;
            },
            set: function (newFetch) {
              _currFetch = newFetch;
            },
          });
        } catch (_) {}

        /* Suppress uncaught extension-injected errors */
        window.addEventListener(
          'error',
          function (e) {
            if (
              (e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
              (e.message && e.message.indexOf('Cannot set property fetch') !== -1)
            ) {
              if (typeof e.stopImmediatePropagation === 'function') {
                e.stopImmediatePropagation();
              }
              if (typeof e.preventDefault === 'function') {
                e.preventDefault();
              }
              return true;
            }
          },
          true
        );
      })();
    </script>
